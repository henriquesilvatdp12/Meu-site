<!-- ASSISTENTE VIRTUAL -->

<div class="assistant">

<div class="chat" id="chat">

<div class="chatHead">

<div>

<b>
🤖 Assistente DH
</b>

<small>
Olá! Posso ajudar você.
</small>

</div>

<button
class="close"
onclick="toggleChat()">

×

</button>

</div>

<div
class="messages"
id="messages">

<div class="msg bot">

Olá! 👋

Eu sou o assistente do
Divulgação Henrique.

Posso explicar como publicar,
o valor, o Pix ou ajudar você
a encontrar uma seção do site.

</div>

</div>

<div class="quick">

<button
onclick="perguntar('Quanto custa publicar?')">

💰 Preço

</button>

<button
onclick="perguntar('Como publicar?')">

📢 Como publicar

</button>

<button
onclick="perguntar('Qual é o Pix?')">

💳 Pix

</button>

<button
onclick="perguntar('WhatsApp')">

📱 WhatsApp

</button>

</div>

<div class="chatInput">

<input
id="chatText"
placeholder="Digite sua pergunta..."
onkeydown="if(event.key==='Enter') enviar()">

<button onclick="enviar()">
Enviar
</button>

<button
onclick="ouvir()"
title="Falar">

🎤

</button>

</div>

</div>


<!--
IMPORTANTE:

Coloque a imagem que você enviou
na mesma pasta deste index.html
com o nome:

robo.png

-->

<img
id="robot"
class="robot"
src="robo.png"
alt="Assistente virtual Divulgação Henrique"
onclick="toggleChat">

</div>


<script>

const PIX =
"30ae9503-548c-446a-9211-8d9884639535";

const ADMIN_WA =
"5562984920692";


/* COPIAR PIX */

function copiarPix(){

navigator.clipboard
.writeText(PIX)
.then(function(){

alert("Chave Pix copiada!");

})
.catch(function(){

alert(
"Copie a chave Pix manualmente:\n\n"
+ PIX
);

});

}


/* PESQUISA */

function buscar(){

const q =
document
.getElementById("search")
.value
.toLowerCase();

document
.querySelectorAll(".ad")
.forEach(function(ad){

ad.style.display =
ad.innerText
.toLowerCase()
.includes(q)
? "block"
: "none";

});

}


/* ABRIR CHAT */

function toggleChat(){

document
.getElementById("chat")
.classList
.toggle("open");

}


/* MENSAGEM */

function addMsg(text,who){

const box =
document.getElementById("messages");

const msg =
document.createElement("div");

msg.className =
"msg " + who;

msg.textContent =
text;

box.appendChild(msg);

box.scrollTop =
box.scrollHeight;

}


/* RESPOSTAS */

function responder(q){

const t =
q.toLowerCase();


if(
t.includes("preço") ||
t.includes("valor") ||
t.includes("custa") ||
t.includes("5")
){

return "A publicação custa R$ 5,00. 💰";

}


if(
t.includes("pix") ||
t.includes("pagar")
){

return (
"A chave Pix é:\n\n"
+ PIX
+ "\n\nDepois, envie o comprovante junto com os dados do anúncio."
);

}


if(
t.includes("publicar") ||
t.includes("anúncio") ||
t.includes("anuncio")
){

return (
"Para publicar, vá até a seção "
+ "“Publique seu anúncio”, preencha "
+ "os dados, faça o Pix de R$ 5,00 "
+ "e envie pelo WhatsApp. 📢"
);

}


if(
t.includes("whatsapp") ||
t.includes("contato")
){

return (
"Você pode falar com a Divulgação "
+ "Henrique pelo botão de WhatsApp "
+ "do site. 📱"
);

}


if(
t.includes("beleza") ||
t.includes("unha")
){

return (
"Na categoria Beleza você pode "
+ "divulgar serviços como unhas, "
+ "esmaltação em gel, blindagem "
+ "e banho em gel. 💅"
);

}


if(
t.includes("oi") ||
t.includes("olá") ||
t.includes("ola")
){

return (
"Olá! 😄 Como posso ajudar? "
+ "Posso explicar o preço, Pix "
+ "ou como publicar."
);

}


return (
"Ainda estou aprendendo! 🤖\n\n"
+ "Tente perguntar sobre preço, "
+ "Pix, publicação ou WhatsApp."
);

}


/* PERGUNTAR */

function perguntar(q){

addMsg(q,"user");

setTimeout(function(){

const resposta =
responder(q);

addMsg(
resposta,
"bot"
);

falar(resposta);

},300);

}


/* ENVIAR */

function enviar(){

const input =
document.getElementById("chatText");

const q =
input.value.trim();

if(!q){
return;
}

input.value="";

perguntar(q);

}


/* FALAR */

function falar(text){

if(
!("speechSynthesis" in window)
){
return;
}

speechSynthesis.cancel();

const voz =
new SpeechSynthesisUtterance(
text.replace(/\n/g," ")
);

voz.lang="pt-BR";
voz.rate=.95;

const robot =
document.getElementById("robot");

robot.classList.add("speaking");

voz.onend=function(){

robot.classList.remove(
"speaking"
);

};

speechSynthesis.speak(voz);

}


/* MICROFONE */

function ouvir(){

const SR =
window.SpeechRecognition ||
window.webkitSpeechRecognition;

if(!SR){

alert(
"Seu navegador não oferece "
+ "reconhecimento de voz. "
+ "Você pode digitar."
);

return;

}

const reconhecimento =
new SR();

reconhecimento.lang =
"pt-BR";

reconhecimento.interimResults =
false;

reconhecimento.maxAlternatives =
1;

const robot =
document.getElementById("robot");

robot.classList.add("speaking");

reconhecimento.start();


reconhecimento.onresult =
function(event){

robot.classList.remove(
"speaking"
);

document.getElementById(
"chatText"
).value =
event.results[0][0].transcript;

enviar();

};


reconhecimento.onerror =
function(){

robot.classList.remove(
"speaking"
);

};


reconhecimento.onend =
function(){

robot.classList.remove(
"speaking"
);

};

}


/* FORMULÁRIO */

document
.getElementById("form")
.addEventListener(
"submit",
function(event){

event.preventDefault();


const nome =
document.getElementById(
"nome"
).value;


const titulo =
document.getElementById(
"titulo"
).value;


const categoria =
document.getElementById(
"categoria"
).value;


const descricao =
document.getElementById(
"descricao"
).value;


const telefone =
document.getElementById(
"telefone"
).value;


const mensagem =
`📢 NOVO ANÚNCIO - DIVULGAÇÃO HENRIQUE

👤 Nome: ${nome}

📌 Título: ${titulo}

📂 Categoria: ${categoria}

📝 Descrição:
${descricao}

📱 WhatsApp: ${telefone}

💰 Publicação: R$ 5,00

💳 Pix:
${PIX}

📎 Vou enviar o comprovante do Pix nesta conversa.`;


window.open(
"https://wa.me/"
+ ADMIN_WA
+ "?text="
+ encodeURIComponent(mensagem),
"_blank"
);

});

</script>

</body>
</html>
